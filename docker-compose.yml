services:
  minerva-pgsql:
    image: postgres
    container_name: minerva-pgsql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    networks:
      - minerva-network

  minerva-api:
    image: vedph2020/minerva-api:0.0.6
    ports:
      - 5180:8080
    depends_on:
      - minerva-pgsql
    environment:
      - CONNECTIONSTRINGS__DEFAULT=User ID=postgres;Password=postgres;Host=minerva-pgsql;Port=5432;Database={0};
      # - ALLOWEDORIGINS__3=http://www.something.com
      - SEEDDELAY=30
      - MESSAGING__APIROOTURL=https://minerva.it/api/
      - MESSAGING__APPROOTURL=https://minerva.it/
      - MESSAGING__SUPPORTEMAIL=attichiari@unige.it
      # unzip bin files from DB into host opt/dump to restore the DB
      - DATA__SOURCEDIR=/opt/dump/
    volumes:
      - /opt/dump:/opt/dump
    networks:
      - minerva-network

  minerva-app:
    image: vedph2020/minerva-app:0.0.3
    ports:
      - 4200:80
    depends_on:
      - minerva-api
    networks:
      - minerva-network

networks:
  minerva-network:
    driver: bridge
