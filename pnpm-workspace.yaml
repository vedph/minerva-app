allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
overrides:
  # @angular/compiler-cli 22.2 imports encodeRangeMappings, which only exists
  # since 1.6.0, while still declaring ^1.4.14: without this the lockfile keeps
  # 1.5.5 and the build fails with "Angular compilation initialization failed"
  '@jridgewell/sourcemap-codec': ^1.6.0
minimumReleaseAgeExclude:
  - '@angular/animations@22.0.3'
  - '@angular/common@22.0.3'
  - '@angular/compiler-cli@22.0.3'
  - '@angular/compiler@22.0.3'
  - '@angular/core@22.0.3'
  - '@angular/forms@22.0.3'
  - '@angular/localize@22.0.3'
  - '@angular/platform-browser-dynamic@22.0.3'
  - '@angular/platform-browser@22.0.3'
  - '@angular/router@22.0.3'
  - '@myrmidon/pythia-api@9.0.0 || 11.0.0'
  - '@myrmidon/pythia-core@9.0.0 || 11.0.0'
  - '@myrmidon/pythia-document-reader@9.0.0 || 11.0.0 || 11.0.1 || 11.0.2'
  - '@myrmidon/pythia-query-builder@10.0.0 || 11.0.0'
  - '@myrmidon/pythia-search@10.0.0 || 11.0.0 || 11.0.1 || 11.0.2'
  - '@myrmidon/pythia-stats@9.0.0 || 11.0.0 || 11.0.1'
  - '@myrmidon/pythia-ui@9.0.0 || 11.0.0'
  - '@myrmidon/pythia-word-index@9.0.0 || 11.0.0'
  - '@rollup/rollup-win32-arm64-msvc@4.64.4'
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
  - '@angular-devkit/architect@0.2202.3'
  - '@angular-devkit/core@22.2.3'
  - '@angular-devkit/schematics@22.2.3'
  - '@angular/build@22.2.3'
  - '@angular/cli@22.2.3'
  - '@schematics/angular@22.2.3'
