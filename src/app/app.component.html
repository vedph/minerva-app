<div>
  <header>
    <mat-toolbar class="mat-primary" id="toolbar">
      <a mat-button id="logo" routerLink="/home">
        <img src="./img/ac-pen_40.png" alt="Minerva" />
      </a>
      <!-- <a mat-button routerLink="/home">Minerva</a> -->

      <!-- index -->
      <button type="button" mat-button routerLink="/index" i18n>Index</button>

      <!-- search -->
      <button type="button" mat-button routerLink="/search" i18n>Search</button>

      <!-- help -->
      <button type="button" mat-button routerLink="/manual" i18n>Help</button>

      <!-- information  -->
      <button type="button" mat-button [matMenuTriggerFor]="infoMenu" i18n>
        Info
      </button>
      <mat-menu #infoMenu>
        <a mat-menu-item routerLink="/stats" i18n>Statistics</a>
        <a mat-menu-item routerLink="/about" i18n>About the project</a>
      </mat-menu>

      <span class="tb-fill-remaining-space"></span>
      <ngx-theme-toggle />
    </mat-toolbar>
  </header>
  <main>
    <router-outlet></router-outlet>
  </main>

  <footer>
    <span><a routerLink="/about">AttiChiari</a></span> -
    <span>
      <a href="mailto:attichiari@unige.it">attichiari&#x40;unige.it</a>
      (Università di Genova),
      <a href="mailto:attichiari@unisalento.it"
        >attichiari&#x40;unisalento.it</a
      >
      (Università del Salento),
      <a href="mailto:attichiari@unitus.it">attichiari&#x40;unitus.it</a>
      (Università degli studi della Tuscia)</span
    >
    - <span i18n>version</span> {{ version() }}
  </footer>
</div>
