<mat-card>
  <mat-card-header>
    <mat-icon mat-card-avatar>contact_page</mat-icon>
    <mat-card-title i18n>Statistics</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div id="pie">
      <div echarts [options]="chartOptions" class="chart"></div>
    </div>
    <div id="cloud">
      <angular-tag-cloud
        [data]="cloudData"
        [width]="1000"
        [height]="400"
        [zoomOnHover]="zoomOnHoverOptions"
      >
      </angular-tag-cloud>
    </div>
  </mat-card-content>
</mat-card>
